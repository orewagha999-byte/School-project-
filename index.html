<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyBuddy: turn your notes into a summary, flashcards and a quiz</title>
<meta name="description" content="Paste your notes and get a highlighted summary, flashcards and a quiz. Runs entirely in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("sb-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>StudyBuddy</span></h1>
    <button id="theme" class="switch" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <p class="lead">Paste your notes. Get the key points highlighted, flashcards to flip, and a quiz to check yourself.</p>

  <section aria-label="Your notes">
    <label for="notes" class="sr">Your notes</label>
    <textarea id="notes" placeholder="Paste or type your notes here. Full sentences work best."></textarea>
    <div class="row">
      <span id="count" class="muted">0 words</span>
      <label class="btn" for="file">Upload .txt or .md</label>
      <input type="file" id="file" accept=".txt,.md,text/plain" hidden>
      <button type="button" id="sample">Try a sample</button>
      <button type="button" id="clear">Clear</button>
      <button type="button" id="go" class="primary">Make study material</button>
    </div>
    <p id="msg" class="msg" role="status"></p>
  </section>

  <div id="results" hidden>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="summary" aria-selected="true">Summary</button>
      <button type="button" role="tab" data-tab="cards" aria-selected="false">Flashcards</button>
      <button type="button" role="tab" data-tab="quiz" aria-selected="false">Quiz</button>
    </div>

    <section id="summary" class="panel">
      <label class="len">Sentences to keep: <b id="lenv">4</b>
        <input type="range" id="len" min="1" max="8" value="4">
      </label>
      <ul id="sumList"></ul>
      <p class="muted">Key terms</p>
      <div id="keys" class="chips"></div>
    </section>

    <section id="cards" class="panel" hidden>
      <button type="button" id="fc" class="fc" aria-live="polite">
        <small id="fcSide"></small>
        <span id="fcText"></span>
      </button>
      <div class="row">
        <button type="button" id="prev">Previous</button>
        <span id="fcCount" class="muted"></span>
        <button type="button" id="next">Next</button>
        <button type="button" id="shuf">Shuffle</button>
      </div>
    </section>

    <section id="quiz" class="panel" hidden>
      <div id="quizBox"></div>
    </section>
  </div>

  <footer class="muted">Everything runs in your browser. Your notes stay on your device.</footer>
</div>
<script src="script.js"></script>
</body>
</html>
